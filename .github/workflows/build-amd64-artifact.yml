name: Build New API amd64 image artifact

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build linux/amd64 image
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build linux/amd64 image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: new-api-x-x:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Export image and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          image_tag="new-api-x-x:${GITHUB_SHA}"
          archive="dist/new-api-x-x-${GITHUB_SHA::12}-linux-amd64.tar.gz"
          docker image inspect "$image_tag" --format 'Image={{.Id}} Arch={{.Architecture}} OS={{.Os}}'
          docker save "$image_tag" | gzip -c > "$archive"
          sha256sum "$archive" > "${archive}.sha256"
          ls -lh dist

      - name: Upload image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: new-api-x-x-linux-amd64-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
