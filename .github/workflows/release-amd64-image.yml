name: Release New API amd64 image

on:
  push:
    tags:
      - 'x-x-custom-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish (for example x-x-custom-20260810)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish linux/amd64 image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build linux/amd64 image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: new-api-x-x:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Export image and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          image_tag="new-api-x-x:${GITHUB_SHA}"
          archive="dist/new-api-x-x-${RELEASE_TAG}-linux-amd64.tar.gz"
          docker image inspect "$image_tag" --format 'Image={{.Id}} Arch={{.Architecture}} OS={{.Os}}'
          docker save "$image_tag" | gzip -c > "$archive"
          sha256sum "$archive" > "${archive}.sha256"
          ls -lh dist

      - name: Create GitHub Release and upload image
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: X-X New API ${{ env.RELEASE_TAG }}
          body: |
            X-X New API custom image release.

            - Platform: linux/amd64
            - Commit: ${{ github.sha }}
            - Load with `docker load -i <image>.tar.gz`
            - Verify the accompanying `.sha256` file before loading.
          files: dist/*
          fail_on_unmatched_files: true
