name: Release New API amd64 image

on:
  push:
    tags:
      - 'x-x-custom-*'
      - 'v*\+lqy007700\+v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag matching common/x_x_version.txt (for example v1.0.0-rc.47+lqy007700+v1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish linux/amd64 image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - name: Validate release tag and read checked-out commit
        id: metadata
        run: bash scripts/x-x-build-metadata.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build linux/amd64 image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: new-api-x-x:${{ steps.metadata.outputs.commit }}
          build-args: |
            X_X_BUILD_COMMIT=${{ steps.metadata.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Export image and checksum
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.metadata.outputs.commit }}
        run: |
          set -euo pipefail
          mkdir -p dist
          image_tag="new-api-x-x:${SOURCE_COMMIT}"
          archive="dist/new-api-x-x-${RELEASE_TAG}-linux-amd64.tar.gz"
          docker image inspect "$image_tag" --format 'Image={{.Id}} Arch={{.Architecture}} OS={{.Os}}'
          docker save "$image_tag" | gzip -c > "$archive"
          sha256sum "$archive" > "${archive}.sha256"
          ls -lh dist

      - name: Create GitHub Release and upload image
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: X-X New API ${{ env.RELEASE_TAG }}
          draft: true
          prerelease: ${{ contains(steps.metadata.outputs.upstream, '-rc.') || contains(steps.metadata.outputs.upstream, '-alpha.') || contains(steps.metadata.outputs.upstream, '-beta.') }}
          body: |
            X-X New API custom image release.

            - X-X version: ${{ steps.metadata.outputs.version }}
            - Official QuantumNous/new-api baseline: ${{ steps.metadata.outputs.upstream }}
            - Platform: linux/amd64
            - Commit: ${{ steps.metadata.outputs.commit }}
            - Load with `docker load -i <image>.tar.gz`
            - Verify the accompanying `.sha256` file before loading.
            - Deploy manually using the existing blue-green procedure; this release does not deploy any server.
          files: dist/*
          fail_on_unmatched_files: true

      - name: Publish only after both assets have been uploaded
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          archive="new-api-x-x-${RELEASE_TAG}-linux-amd64.tar.gz"
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > /tmp/x-x-release-assets.txt
          grep -Fx "$archive" /tmp/x-x-release-assets.txt
          grep -Fx "${archive}.sha256" /tmp/x-x-release-assets.txt
          gh release edit "$RELEASE_TAG" --draft=false
